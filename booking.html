<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Siam Elegance</title>
    <style>
        :root {
            --teal: #086b6e;
            --saffron: #FF9F1C;
            --ivory: #FCF8F0;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--ivory);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .booking-card {
            background: white;
            padding: 50px 40px;
            border-radius: 0px; /* Прямые углы для премиальности */
            border-top: 4px solid var(--saffron); /* Деликатный цветовой акцент */
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 0px; /* Убираем скругления */
            background-color: var(--ivory);
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--teal);
        }

        .btn-send {
            background-color: var(--saffron);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 0px; /* Убираем скругления */
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-send:hover {
            background-color: #e88d12;
            transform: translateY(-2px);
        }
        #status-msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>Забронировать стол</h2>
        <form id="tg-form">
            <input type="text" name="name" placeholder="Ваше имя" required>
            <input type="tel" name="phone" placeholder="Номер телефона" required>
            <input type="datetime-local" name="date" required>
            <button type="submit" class="btn-send">Подтвердить бронь</button>
        </form>
        <div id="status-msg"></div>
    </div>

    <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOA1gntnPNcQ6pGZD2lxtFRspp_yGE1CzpjuwC_JgqOS7vzICBla9XvSzLPN4nNWII/exec";

    document.getElementById('tg-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const status = document.getElementById('status-msg');
    const btn = this.querySelector('.btn-send');
    
    status.innerText = "Отправка...";
    status.style.color = "black";
    btn.disabled = true;

    const formData = new URLSearchParams();
    formData.append('name', this.name.value);
    formData.append('phone', this.phone.value);
    formData.append('date', this.date.value);

    // Отправляем только в Google Таблицы
    fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', 
        body: formData
    })
    .then(() => {
        // Так как используется no-cors, мы считаем, что всё ок, если запрос ушел
        status.innerText = "Готово! Бронь сохранена.";
        status.style.color = "green";
        this.reset();
    })
    .catch(err => {
        console.error('Ошибка:', err);
        status.innerText = "Ошибка при сохранении.";
        status.style.color = "red";
    })
    .finally(() => {
        btn.disabled = false;
    });
});
    </script>
</body>
</html>
